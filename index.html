    function getCalendarDiff(startStr, endStr) {
      if (!startStr || !endStr) return { years: 0, months: 0, days: 0 };
      const s = new Date(startStr + "T00:00:00");
      const e = new Date(endStr + "T00:00:00");
      if (isNaN(s) || isNaN(e) || e < s) return { years: 0, months: 0, days: 0 };
      
      // 역에 의해 기간 계산 시 마지막 일까지 포함하므로 1일을 더함
      const eObj = new Date(e.getTime() + 86400000);
      
      let y = eObj.getFullYear() - s.getFullYear();
      let m = eObj.getMonth() - s.getMonth();
      let d = eObj.getDate() - s.getDate();
      
      if (d < 0) {
        m -= 1;
        const prevMonth = new Date(eObj.getFullYear(), eObj.getMonth(), 0);
        d += prevMonth.getDate();
      }
      if (m < 0) {
        y -= 1;
        m += 12;
      }
      return { years: y, months: m, days: d };
    }

    function getNetCalendarPeriod(cStartStr, cEndStr, dispatches) {
      if (!cStartStr || !cEndStr) return { years: 0, months: 0, days: 0 };
      const careerDiff = getCalendarDiff(cStartStr, cEndStr);
      if (careerDiff.years === 0 && careerDiff.months === 0 && careerDiff.days === 0) {
        return careerDiff;
      }

      let overlapY = 0;
      let overlapM = 0;
      let overlapD = 0;

      for (const d of dispatches) {
        if (!d.start || !d.end) continue;
        const cs = new Date(cStartStr + "T00:00:00");
        const ce = new Date(cEndStr + "T00:00:00");
        const ds = new Date(d.start + "T00:00:00");
        const de = new Date(d.end + "T00:00:00");

        const os = new Date(Math.max(cs, ds));
        const oe = new Date(Math.min(ce, de));
        if (os <= oe) {
          const osStr = os.toISOString().split('T')[0];
          const oeStr = oe.toISOString().split('T')[0];
          const diff = getCalendarDiff(osStr, oeStr);
          overlapY += diff.years;
          overlapM += diff.months;
          overlapD += diff.days;
        }
      }

      let netY = careerDiff.years - overlapY;
      let netM = careerDiff.months - overlapM;
      let netD = careerDiff.days - overlapD;

      // 30일 = 1월 환산 및 마이너스 일수 보정
      while (netD < 0) {
        netM -= 1;
        netD += 30;
      }
      while (netM < 0) {
        netY -= 1;
        netM += 12;
      }
      if (netY < 0) {
        return { years: 0, months: 0, days: 0 };
      }
      return { years: netY, months: netM, days: netD };
    }

        if (raw.endsWith("유치원")) {
          return raw + "장";
        }
        if (raw.endsWith("유")) {
          return raw.slice(0, -1) + "유치원장";
        }
        return raw + "유치원장";
      } else {

        }
        if (raw.endsWith("초")) {
          return raw.slice(0, -1) + "초등학교장";
        }
        return raw + "초등학교장";
      }
    }

    function floor3(n) {
      const val = Number(n);
      if (!Number.isFinite(val)) return 0;
      return Math.floor(val * 1000 + 1e-9) / 1000;
    }

    function fmt(n) {
      const val = Number(n);
      if (!Number.isFinite(val)) return "0";
      const r = floor3(val);
      if (r < 0) {
        return "△" + Math.abs(r).toString();
      }
      return r.toString();
    }

        <button type="button" className="tp-add-btn" onClick={onAdd}>
          <Plus size={14} /> {addLabel}
        </button>
      );
    }

    /* ==================================================================== */
    function TransferApplicationPrototype() {
      const [state, setState] = useState(initialState);

      const setApplicant = (patch) =>
        setState((s) => ({ ...s, applicant: { ...s.applicant, ...patch } }));
      const setFlags = (patch) => setState((s) => ({ ...s, flags: { ...s.flags, ...patch } }));
      const setConfirmation = (patch) =>
        setState((s) => ({ ...s, confirmation: { ...s.confirmation, ...patch } }));
      const setPref = (key, patch) =>
        setState((s) => ({ ...s, prefs: { ...s.prefs, [key]: { ...s.prefs[key], ...patch } } }));

      /* ---- 반복 테이블 헬퍼 ---- */
      const addFamily = () =>
        setState((s) => ({
          ...s,
          family: [...s.family, { id: uid(), affiliation: "", position: "", name: "" }],
        }));
      const updateFamily = (id, patch) =>
        setState((s) => ({
          ...s,
          family: s.family.map((f) => (f.id === id ? { ...f, ...patch } : f)),
        }));
      const removeFamily = (id) =>
        setState((s) => ({ ...s, family: s.family.filter((f) => f.id !== id) }));

      const addCareer = () =>
        setState((s) => ({
          ...s,
          careers: [
            ...s.careers,
            { id: uid(), schoolName: "", start: "", end: "", district: "1지구", zone: DISTRICT_ZONES["1지구"][0].code },
          ],
        }));
      const updateCareer = (id, patch) =>
        setState((s) => ({
          ...s,
          careers: s.careers.map((c) => (c.id === id ? { ...c, ...patch } : c)),
        }));
      const removeCareer = (id) =>
        setState((s) => ({ ...s, careers: s.careers.filter((c) => c.id !== id) }));

      const addDispatch = () =>
        setState((s) => ({
          ...s,
          dispatches: [...s.dispatches, { id: uid(), type: "파견", org: "", start: "", end: "" }],
        }));
      const updateDispatch = (id, patch) =>
        setState((s) => ({
          ...s,
          dispatches: s.dispatches.map((d) => (d.id === id ? { ...d, ...patch } : d)),
        }));
      const removeDispatch = (id) =>
        setState((s) => ({ ...s, dispatches: s.dispatches.filter((d) => d.id !== id) }));

      const addBonus = (preset) =>
        setState((s) => {
          const isPeriod = preset && (
            preset.label.includes("년 ") ||
            preset.label.includes("연구학교") ||
            preset.label.includes("3.연구학교") ||
            preset.label.includes("7.장기근속") ||
            preset.label === "8.기타"
          );
          const isModel = preset && (preset.label.includes("국무총리표창") || preset.label.includes("교육감표창"));
          let initialType = preset ? preset.label : "";
          let initialScore = preset ? preset.score : 0;
          let initialDate = "";
          if (initialType === "2.연구실적" || initialType === "연구실적") {
            initialType = "연구점수 전국1등급";
          } else if (initialType === "1.표창" || initialType === "표창") {
            initialType = "훈·포장";
          } else if (initialType === "3.연구학교") {
            initialType = "연구학교";
          } else if (initialType === "5.우대") {
            initialType = "우대";
          } else if (initialType === "7.장기근속") {
            initialType = "장기근속";
          } else if (initialType === "8.기타(호봉)") {
            initialType = "호봉(" + (s.applicant.salaryStep || "") + ")";
            initialScore = s.applicant.salaryStep ? floor3(Number(s.applicant.salaryStep) * 0.05) : 0;
            initialDate = (s.schoolYear || 2027) + "-01-01";
          } else if (initialType === "8.기타") {
            initialType = "복식학급담임교사";
            initialScore = 0.5;
          } else if (initialType === "감점") {
            initialType = "강등";
            initialScore = -5;
          }
          return {
            ...s,
            bonuses: [
              ...s.bonuses,
              {
                id: uid(),
                date: initialDate,
                type: initialType,
                score: initialScore,
                inputMode: isPeriod ? "period" : "single",
                start: "",
                end: "",
                annualScore: initialScore,
                isModelCivilServant: isModel ? true : false,
              },
            ],
          };
        });
      const updateBonus = (id, patch) =>
        setState((s) => ({
          ...s,
          bonuses: s.bonuses.map((b) => (b.id === id ? { ...b, ...patch } : b)),
        }));
      const removeBonus = (id) =>
        setState((s) => ({ ...s, bonuses: s.bonuses.filter((b) => b.id !== id) }));

      /* ---- 자동 계산 ---- */
      const careerRows = useMemo(
        () =>
          state.careers.map((c) => {
            const zoneData = DISTRICT_ZONES[c.district]?.find((z) => z.code === c.zone);
            const annual = zoneData?.annual || 0;
            const monthly = zoneData?.monthly || 0;
            const net = getNetCalendarPeriod(c.start, c.end, state.dispatches);
            
            // 개별 행 표시용 년/월 계산 (남은 일수가 30일 이상일 때만 개별 행에서 개월로 올림 표기)
            const normalizedMonths = net.months + Math.floor(net.days / 30);
            const displayY = net.years + Math.floor(normalizedMonths / 12);
            const displayM = normalizedMonths % 12;
            const displayD = net.days % 30; // 자투리 일수

            const score = floor3(displayY * annual + displayM * monthly);
            return {
              ...c,
              years: displayY,
              months: displayM,
              days: displayD, // 자투리 일수 전달
              netYears: net.years,   // 원본 년
              netMonths: net.months, // 원본 월
              netDays: net.days,     // 원본 일
              annual,
              monthly,
              score
            };
          }),
        [state.careers, state.dispatches]
      );

      const careerSubtotal = useMemo(() => {
        // 그룹(district + zone)별로 원본 기간(년, 월, 일)을 모두 합산한 후 30일=1월 룰을 최종 적용하여 소계를 계산합니다.
        const groups = {};
        careerRows.forEach((r) => {
          const key = `${r.district}_${r.zone}`;
          if (!groups[key]) {
            groups[key] = {
              annual: r.annual,
              monthly: r.monthly,
              sumYears: 0,
              sumMonths: 0,
              sumDays: 0,
            };
          }
          groups[key].sumYears += r.netYears;
          groups[key].sumMonths += r.netMonths;
          groups[key].sumDays += r.netDays;
        });

        let total = 0;
        Object.values(groups).forEach((g) => {
          let m = g.sumMonths + Math.floor(g.sumDays / 30); // 자투리 일수들을 모두 합산하여 30일마다 1월 평정
          let y = g.sumYears + Math.floor(m / 12);
          m = m % 12;
          total += y * g.annual + m * g.monthly;
        });
        return floor3(total);
      }, [careerRows]);

      const dispatchRows = useMemo(
        () =>
          state.dispatches.map((d) => {
            const diff = getCalendarDiff(d.start, d.end);
            const totalMonths = diff.months + Math.floor(diff.days / 30);
            const years = diff.years + Math.floor(totalMonths / 12);
            const months = totalMonths % 12;
            return { ...d, years, months };
          }),
        [state.dispatches]
      );

      const salaryBonus = 0;

      const computedBonuses = useMemo(
        () =>
          state.bonuses.map((b) => {
            const isResSchool = b.type && b.type.includes("연구학교");
            let limit = OTHER_LIMITS[b.type];
            if (isResSchool) limit = 1.0;
            if (b.inputMode === "period") {
              const diff = getCalendarDiff(b.start, b.end);
              const totalMonths = diff.years * 12 + diff.months + Math.floor(diff.days / 30);
              let parsedScore = floor3((Number(b.annualScore || 0) * totalMonths) / 12);
              if (limit !== undefined && limit !== null) {
                parsedScore = Math.min(limit, parsedScore);
              }
              const years = Math.floor(totalMonths / 12);
              const months = Math.floor(totalMonths % 12);
              return { ...b, parsedScore, years, months };
            }
            let parsedScore = Number(b.score) || 0;
            if (limit !== undefined && limit !== null) {
              parsedScore = Math.min(limit, parsedScore);
            }
            return { ...b, parsedScore };
          }),
        [state.bonuses]
      );
 
      const bonusSubtotal = floor3(
        (() => {
          const scoresByType = {};
          computedBonuses.forEach(b => {
            const type = b.type || "";
            const score = Number(b.parsedScore) || 0;
            let groupKey = type;
            if (type.includes("연구학교")) {
              groupKey = "연구학교";
            }
            scoresByType[groupKey] = (scoresByType[groupKey] || 0) + score;
          });
          let sum = 0;
          Object.keys(scoresByType).forEach(type => {
            let score = scoresByType[type];
            let limit = OTHER_LIMITS[type];
            if (type === "연구학교") {
              limit = 1.0;
            }
            if (limit !== undefined && limit !== null) {
              score = Math.min(limit, score);
            }
            sum += score;
          });
          return sum;
        })()
      );
 
      const totalScore = floor3(careerSubtotal + bonusSubtotal);
 
      // 서식 실제 레이아웃: 연월일/종별/평정점 2열 배치 후 소계를 오른쪽에 rowSpan으로 병합
      const bonusItems = useMemo(
        () => [
          ...computedBonuses.map((b) => {
            const displayType = b.isModelCivilServant ? `${b.type}(모범공무원)` : b.type;
            if (b.inputMode === "period") {
              const periodStr = b.years > 0 ? (b.months > 0 ? `${b.years}년 ${b.months}월` : `${b.years}년`) : `${b.months}월`;
              return {
                id: b.id,
                date: b.start && b.end ? `${formatDateStr(b.start)}~${formatDateStr(b.end)}` : "-",
                type: b.start && b.end ? `${displayType || "-"} (${periodStr})` : displayType || "-",
                score: b.parsedScore,
              };
            }
            return {
              id: b.id,
              date: formatDateStr(b.date) || "-",
              type: displayType || "-",
              score: b.parsedScore,
            };
          }),
        ],
        [computedBonuses, salaryBonus, state.schoolYear, state.applicant.salaryStep]
      );
      const bonusRowCount = Math.max(3, Math.ceil(bonusItems.length / 2));

      /* ---- 액션 ---- */
      const loadSampleData = () => {
        if (confirm("샘플 데이터(전보희망원_김나라_2027)를 불러오시겠습니까? 현재 입력된 내용은 대체됩니다.")) {
          setState({ ...initialState, ...SAMPLE_DATA });
        }
      };

      const resetAll = () => {
        if (confirm("모든 입력 내용을 초기화할까요? 되돌릴 수 없습니다.")) {
          setState(initialState);
        }
      };

      const exportJSON = () => {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `전보희망원_${state.applicant.name || "작성중"}_${state.schoolYear}.json`;
        a.click();
        URL.revokeObjectURL(url);
      };

      const importJSON = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const data = JSON.parse(reader.result);
            setState({ ...initialState, ...data });
          } catch {
            alert("파일을 읽을 수 없습니다. 올바른 JSON 파일인지 확인해 주세요.");
          }
        };
        reader.readAsText(file);
        e.target.value = "";
      };

      const doPrint = () => window.print();

      const missingRequired =
        !state.applicant.schoolName ||
        !state.applicant.name ||
        !state.applicant.birthDate ||
        !state.applicant.salaryStep ||
        !state.prefs.p1.county;

      return (

                  const isResearch = RESEARCH_TYPES.some(r => b.type === r.label) || b.type === "2.연구실적" || b.type === "연구실적";
                  const isOtherDropdown = OTHER_TYPES.some(o => b.type === o.label) || b.type === "8.기타";
                  const isDemerit = DEMERIT_TYPES.some(d => b.type === d.label) || b.type === "감점";
                  let categoryLabel = "가산점";
                  if (isAward) categoryLabel = "1.표창";
                  else if (isResearch) categoryLabel = "2.연구실적";
                  else if (b.type && b.type.includes("연구학교")) categoryLabel = "3.연구학교";
                  else if (b.type && b.type.includes("우대")) categoryLabel = "5.우대";
                  else if (b.type && b.type.includes("장기근속")) categoryLabel = "7.장기근속";
                  else if (b.type && b.type.includes("호봉")) categoryLabel = "8.기타(호봉)";
                  else if (isOtherDropdown) categoryLabel = "8.기타";
                  else if (isDemerit) categoryLabel = "감점";

                            <option value="period">근무 기간</option>

                          <div className="tp-row2">
                            <Field label="근무 시작일">
                              <input type="date" max="9999-12-31" value={b.start || ""} onChange={(e) => updateBonus(b.id, { start: e.target.value })} />
                            </Field>
                            <Field label="근무 종료일">
                              <input type="date" max="9999-12-31" value={b.end || ""} onChange={(e) => updateBonus(b.id, { end: e.target.value })} />

                                step="0.001"

                                onChange={(e) => updateBonus(b.id, { annualScore: e.target.value })}

                              />
                            </Field>
                            <Field label="자동 계산 평정점">
                              <input type="text" disabled value={fmt(b.parsedScore)} />
                            </Field>
                          </div>
                        </>
                      ) : (
                        <div className="tp-row2">
                          <Field label="연월일">
                            <input type="date" max="9999-12-31" value={b.date} onChange={(e) => updateBonus(b.id, { date: e.target.value })} />
                          </Field>
                          <Field label="평정점">
                            <input
                              type="text"
                              value={b.score}
                              onChange={(e) => updateBonus(b.id, { score: e.target.value })}
                              placeholder="예) 0.5 또는 -1.0"

                          </Field>
                        </div>

                            onChange={(e) => {
                              const val = e.target.value;
                              const found = AWARD_TYPES.find(a => a.label === val);
                              const isModel = val === "국무총리표창" || val === "교육감표창";
                              updateBonus(b.id, {
                                type: val,
                                score: found ? found.score : 0,
                                annualScore: found ? found.score : 0,
                                isModelCivilServant: isModel ? b.isModelCivilServant : false
                              });

                          >

                            <option value="표창" disabled hidden>선택해 주세요</option>

                          </select>

                          <select
                            value={b.type === "연구실적" ? "연구점수 전국1등급" : b.type}
                            onChange={(e) => {
                              const val = e.target.value;
                              const found = RESEARCH_TYPES.find(r => r.label === val);
                              updateBonus(b.id, { type: val, score: found ? found.score : 0, annualScore: found ? found.score : 0 });
                            }}
                          >
                            <option value="연구실적" disabled hidden>선택해 주세요</option>
                            {RESEARCH_TYPES.map(r => (
                              <option key={r.label} value={r.label}>{r.label}</option>
                            ))}
                          </select>
                        </Field>
                      ) : isOtherDropdown ? (
                        <Field label="종별 (기타 가산점)">
                          <select
                            value={b.type === "8.기타" ? "복식학급담임교사" : b.type}
                            onChange={(e) => {
                              const val = e.target.value;
                              const found = OTHER_TYPES.find(o => o.label === val);
                              updateBonus(b.id, {
                                type: val,
                                score: 0,
                                annualScore: found ? found.score : 0
                              });
                            }}
                          >
                            <option value="8.기타" disabled hidden>선택해 주세요</option>
                            {OTHER_TYPES.map(o => (

                              const val = e.target.value;

                              updateBonus(b.id, {
                                type: val,
                                score: found ? String(found.score) : "0",
                                annualScore: found ? found.score : 0
                              });
                            }}
                          >
                            <option value="감점" disabled hidden>선택해 주세요</option>

                              <option key={d.label} value={d.label}>{d.label} ({d.score}점)</option>
                            ))}
                          </select>
                          <span className="tp-hint" style={{ fontSize: "11px", color: "var(--text-muted)", marginTop: "4px", display: "block" }}>
                            최근 2년 이내(행정경고는 최근 1년 이내)
                          </span>
                        </Field>
                      ) : (
                        <Field label="종별">
                          <input type="text" value={b.type} onChange={(e) => updateBonus(b.id, { type: e.target.value })} />
                        </Field>
                      )}
                      {(b.type.includes("국무총리표창") || b.type.includes("교육감표창")) && (
                        <div className="tp-toggle" style={{ marginTop: "4px" }}>
                          <span>모범공무원 여부</span>
                          <button
                            type="button"
                            className={"tp-switch" + (b.isModelCivilServant ? " on" : "")}
                            onClick={() => updateBonus(b.id, { isModelCivilServant: !b.isModelCivilServant })}
                          />
                        </div>
                      )}
                    </div>
                  );
                })}
                <div className="tp-preset-row" style={{ marginTop: "12px", marginBottom: "8px" }}>
                  {BONUS_PRESETS.slice(0, 8).map((p) => (
                    <button key={p.label} className="tp-preset-chip" onClick={() => addBonus(p)}>
                      {p.label}
                    </button>
                  ))}
                </div>
                <RowActions onAdd={() => addBonus(null)} addLabel="가산점(감점) 항목 추가" />
                <span className="tp-hint">
                  가산점(감점) 소계(자동계산): {fmt(bonusSubtotal)}점
                </span>
              </Section>

              <Section title="⑨ 확인 · 서명" defaultOpen={false}>
                <Field label="작성일자">
                  <input type="date" max="9999-12-31" value={state.confirmation.date} onChange={(e) => setConfirmation({ date: e.target.value })} />
                </Field>
                <Field label="학교장 성명">
                  <input type="text" value={state.confirmation.principal} onChange={(e) => setConfirmation({ principal: e.target.value })} />
                </Field>
              </Section>
            </aside>

            {/* ============================= 미리보기 ============================= */}
            <div className="tp-preview-col">
              <div className="tp-preview-wrap">


                <div style={{ display: "flex", alignItems: "stretch", marginTop: "4px", marginBottom: "8px", gap: "0" }}>
                  {/* 왼쪽: 문서 제목 (표 스타일 적용 안 함) */}
                  <div style={{
                    width: "45%",
                    display: "flex",
                    flexDirection: "column",
                    justifyContent: "center",
                    alignItems: "center",
                    textAlign: "center",
                    fontSize: "20px",
                    fontWeight: "bold",
                    lineHeight: "1.4",
                    padding: "6px 8px",
                    fontFamily: "Nanum Myeongjo, Batang, serif"
                  }}>
                    <div>{state.schoolYear}학년도</div>
                    <div>
                      (<span className="tp-val">{state.teacherType}</span>) 전보희망원
                    </div>
                  </div>

                  {/* 오른쪽: 희망지 테이블 */}
                  <div style={{ width: "55%" }}>
                    <table className="tp-doc-table" style={{ width: "100%", height: "100%", margin: "0", border: "2px solid #14213b" }}>
                      <tbody>
                        <tr>
                          <th colSpan={3} style={{ height: "22px" }}>1희망</th>
                          <th rowSpan={2} style={{ width: "16%" }}>2희망<br />시군명</th>
                          <th rowSpan={2} style={{ width: "16%" }}>3희망<br />시군명</th>
                          <th rowSpan={2} style={{ width: "18%" }}>4희망<br />시군명</th>
                        </tr>
                        <tr>
                          <th style={{ width: "16%", height: "22px" }}>시군명</th>
                          <th style={{ width: "17%" }}>학교명①</th>
                          <th style={{ width: "17%" }}>학교명②</th>
                        </tr>
                        <tr>
                          <td className="tp-val">{state.prefs.p1.county || ""}</td>
                          <td className="tp-val">{state.prefs.p1.school1 || ""}</td>
                          <td className="tp-val">{state.prefs.p1.school2 || ""}</td>
                          <td className="tp-val">{state.districtExpired ? state.prefs.p2.county || "" : ""}</td>
                          <td className="tp-val">{state.districtExpired ? state.prefs.p3.county || "" : ""}</td>
                          <td className="tp-val">{state.districtExpired ? state.prefs.p4.county || "" : ""}</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                </div>

                {/* 인적사항 테이블 */}
                <table className="tp-doc-table" style={{ border: "2px solid #14213b" }}>
                  <thead>
                    <tr>
                      <th style={{ width: "14%" }}>학교명</th>
                      <th style={{ width: "12%" }}>성명</th>
                      <th style={{ width: "8%" }}>성별</th>
                      <th style={{ width: "14%" }}>생년월일</th>
                      <th style={{ width: "10%" }}>호봉</th>
                      <th style={{ width: "14%" }}>교육<br />총경력</th>
                      <th style={{ width: "14%" }}>현시군<br />근속연수</th>
                      <th style={{ width: "14%" }}>현재교<br />근속연수</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td className="tp-val">{state.applicant.schoolName || ""}</td>
                      <td className="tp-val">{state.applicant.name || ""}</td>
                      <td className="tp-val">{state.applicant.gender}</td>
                      <td className="tp-val">{state.applicant.birthDate || ""}</td>
                      <td className="tp-val">{state.applicant.salaryStep || ""}</td>
                      <td className="tp-val">{state.applicant.totalCareerYears || ""}</td>
                      <td className="tp-val">{state.applicant.currentCountyYears || ""}</td>
                      <td className="tp-val">{state.applicant.currentSchoolYears || ""}</td>
                    </tr>
                  </tbody>
                </table>

                {/* 생활근거지 및 특이사항 테이블 */}
                <table className="tp-doc-table" style={{ border: "2px solid #14213b" }}>
                  <thead>
                    <tr>
                      <th style={{ width: "15%" }}>생활근거지</th>
                      <th style={{ width: "14%" }}>국립학교희망</th>
                      <th style={{ width: "14%" }}>초빙교사지원</th>
                      <th style={{ width: "14%" }}>타시도내신</th>
                      <th style={{ width: "15%" }}>영어장기연수</th>
                      <th style={{ width: "14%" }}>특례조항</th>
                      <th style={{ width: "14%" }}>유예조항</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td className="tp-val">{state.flags.livingBase || ""}</td>
                      <td className="tp-val">{state.flags.nationalSchoolWish ? "○" : "×"}</td>
                      <td className="tp-val">{state.flags.invitedTeacherApply ? "○" : "×"}</td>
                      <td className="tp-val">{state.flags.otherProvinceApply ? "○" : "×"}</td>
                      <td className="tp-val">{state.flags.englishTraining ? "○" : "×"}</td>
                      <td className="tp-val">{state.flags.specialProvision ? "○" : "×"}</td>
                      <td className="tp-val">{state.flags.deferralProvision ? "○" : "×"}</td>
                    </tr>
                  </tbody>
                </table>

                {/* 전보사유 및 가족현황 */}
                <table className="tp-doc-table" style={{ border: "2px solid #14213b" }}>
                  <tbody>
                    <tr>
                      <th rowSpan={Math.max(2, state.family.length + 1)} style={{ width: "10%" }}>전보<br />사유</th>
                      <td rowSpan={Math.max(2, state.family.length + 1)} className="tp-val tp-left" style={{ width: "38%", paddingLeft: "12px" }}>
                        {state.transferReason === "직접 입력" ? state.transferReasonCustom || "" : state.transferReason}
                      </td>
                      <th rowSpan={Math.max(2, state.family.length + 1)} style={{ width: "12%" }}>교육기관<br />근무<br />가족현황</th>
                      <th style={{ width: "16%", height: "22px" }}>소속</th>
                      <th style={{ width: "12%" }}>직위</th>
                      <th style={{ width: "12%" }}>성명</th>
                    </tr>
                    {state.family.length === 0 ? (
                      <tr>
                        <td className="tp-val"></td>
                        <td className="tp-val"></td>
                        <td className="tp-val"></td>
                      </tr>
                    ) : (
                      state.family.map((f, i) => (
                        <tr key={f.id}>
                          <td className="tp-val">{f.affiliation || ""}</td>
                          <td className="tp-val">{f.position || ""}</td>
                          <td className="tp-val">{f.name || ""}</td>
                        </tr>
                      ))
                    )}
                  </tbody>
                </table>

                {/* 경력평정 및 파견휴직 통합 테이블 */}
                <table className="tp-doc-table" style={{ marginTop: "4px", border: "2px solid #14213b" }}>
                  <thead>
                    <tr>
                      <th style={{ width: "10%" }}>구분</th>
                      <th style={{ width: "17%" }}>근무학교명</th>
                      <th style={{ width: "28%" }}>근무기간</th>
                      <th style={{ width: "9%" }}>근무년수</th>
                      <th style={{ width: "18%" }}>지구(급지)</th>
                      <th style={{ width: "10%" }}>평정점</th>
                      <th style={{ width: "8%" }}>소계</th>
                    </tr>
                  </thead>
                  <tbody>
                    {/* 경력평정 데이터 행 */}
                    {Array.from({ length: Math.max(4, careerRows.length) }).map((_, i) => {
                      const c = careerRows[i];
                      return (
                        <tr key={c?.id || `empty-career-${i}`}>
                          {i === 0 && (
                            <td rowSpan={Math.max(4, careerRows.length)} style={{ fontWeight: "bold" }}>
                              경력<br />평정
                            </td>
                          )}
                          <td className="tp-val">{c?.schoolName || ""}</td>
                          <td className="tp-val">{c ? `${formatDateStr(c.start)}~${formatDateStr(c.end)}` : ""}</td>
                          <td className="tp-val">{c ? `${c.years}.${String(c.months).padStart(2, "0")}` : ""}</td>
                          <td className="tp-val">{c ? `${c.district.replace("지구", "")}(${c.zone === "특" ? "특급지" : c.zone})` : ""}</td>
                          <td className="tp-val">{c ? fmt(c.score) : ""}</td>
                          {i === 0 && (
                            <td rowSpan={Math.max(4, careerRows.length) + Math.max(2, dispatchRows.length) + 1} className="tp-val" style={{ fontSize: "12px", fontWeight: "bold" }}>
                              {fmt(careerSubtotal)}
                            </td>
                          )}
                        </tr>
                      );
                    })}

                    {/* 파견휴직 구분선/헤더 행 */}
                    <tr>
                      <th colSpan={2}>구분</th>
                      <th>기관명</th>
                      <th>기간</th>
                      <th>연</th>
                      <th>월</th>
                      {/* 소계는 위에서 span되어 생략 */}
                    </tr>

                    {/* 파견휴직 데이터 행 */}
                    {Array.from({ length: Math.max(2, dispatchRows.length) }).map((_, i) => {
                      const d = dispatchRows[i];
                      return (
                        <tr key={d?.id || `empty-dispatch-${i}`}>
                          {i === 0 && (
                            <td rowSpan={Math.max(2, dispatchRows.length)} style={{ fontWeight: "bold" }}>
                              파견<br />휴직
                            </td>
                          )}
                          <td className="tp-val">{d?.type || ""}</td>
                          <td className="tp-val">{d?.org || ""}</td>
                          <td className="tp-val">{d ? `${formatDateStr(d.start)}~${formatDateStr(d.end)}` : ""}</td>
                          <td className="tp-val">{d ? `${d.years}` : ""}</td>
                          <td className="tp-val">{d ? `${d.months || ""}` : ""}</td>
                          {/* 소계는 위에서 span되어 생략 */}
                        </tr>
                      );
                    })}
                  </tbody>
                </table>

                {/* 가산점 평정 테이블 */}
                <table className="tp-doc-table" style={{ marginTop: "4px", border: "2px solid #14213b" }}>
                  <thead>
                    <tr>
                      <th style={{ width: "10%" }}>구분</th>
                      <th style={{ width: "14%" }}>연월일</th>
                      <th style={{ width: "18%" }}>종별</th>
                      <th style={{ width: "9%" }}>평정점</th>
                      <th style={{ width: "14%" }}>연월일</th>
                      <th style={{ width: "18%" }}>종별</th>
                      <th style={{ width: "9%" }}>평정점</th>
                      <th style={{ width: "8%" }}>소계</th>
                    </tr>
                  </thead>
                  <tbody>
                    {Array.from({ length: Math.max(3, bonusRowCount) }).map((_, r) => {
                      const left = bonusItems[r];
                      const right = bonusItems[r + bonusRowCount];
                      return (
                        <tr key={`bonus-row-${r}`}>
                          {r === 0 && (
                            <td rowSpan={Math.max(3, bonusRowCount)} style={{ fontWeight: "bold" }}>
                              가산점<br />(감점)<br />평정
                            </td>
                          )}
                          <td className="tp-val">{left?.date || ""}</td>
                          <td className="tp-val" style={{ textAlign: "left", paddingLeft: "6px" }}>{left?.type || ""}</td>
                          <td className="tp-val">{left ? fmt(left.score) : ""}</td>
                          <td className="tp-val">{right?.date || ""}</td>
                          <td className="tp-val" style={{ textAlign: "left", paddingLeft: "6px" }}>{right?.type || ""}</td>
                          <td className="tp-val">{right ? fmt(right.score) : ""}</td>
                          {r === 0 && (
                            <td rowSpan={Math.max(3, bonusRowCount)} className="tp-val" style={{ fontSize: "12px", fontWeight: "bold" }}>
                              {fmt(bonusSubtotal)}
                            </td>
                          )}
                        </tr>
                      );
                    })}
                  </tbody>
                </table>

                {/* 총점 테이블 */}
                <table className="tp-doc-table" style={{ marginTop: "4px", border: "2px solid #14213b" }}>
                  <tbody>
                    <tr style={{ background: "#eef1f6", fontWeight: "bold" }}>
                      <td style={{ width: "95%", textAlign: "center", fontSize: "12px", height: "24px" }}>총점</td>
                      <td className="tp-val" style={{ width: "5%", textAlign: "center", fontSize: "13px", fontWeight: "bold" }}>
                        {fmt(totalScore)}
                      </td>
                    </tr>
                  </tbody>
                </table>

                <div style={{ textAlign: "center", marginTop: "12px", fontSize: "15.5px", lineHeight: "1.4" }}>
                  위 기재 내용과 평정점이 틀림없음을 확인하였으며, 위와 같이 전보를 희망하였기에 내신합니다.
                </div>

                <div style={{ textAlign: "center", margin: "10px 0 8px", fontSize: "17px", fontWeight: "bold", letterSpacing: "2px" }}>
                  {state.confirmation.date ? (
                    (() => {
                      const d = new Date(state.confirmation.date);
                      return isNaN(d)
                        ? `${state.schoolYear || 2027} 년     월     일`
                        : `${d.getFullYear()} 년   ${String(d.getMonth() + 1).padStart(2, "0")} 월   ${String(d.getDate()).padStart(2, "0")} 일`;
                    })()
                  ) : (
                    `${state.schoolYear || 2027} 년     월     일`
                  )}
                </div>

                {/* 교감/장학사 확인 위원 서명 란 */}
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end", marginTop: "10px", padding: "0 10px" }}>
                  <table style={{ width: "192px", borderCollapse: "collapse", margin: "0", border: "2px solid #14213b" }}>
                    <tbody>
                      <tr>
                        <th rowSpan={2} style={{ width: "43px", border: "1px solid #8b93a6", fontSize: "14px", padding: "2px", backgroundColor: "#eef1f6" }}>확<br />인</th>
                        <th style={{ width: "74px", border: "1px solid #8b93a6", fontSize: "14px", padding: "2px", height: "22px", backgroundColor: "#eef1f6" }}>교감</th>
                        <th style={{ width: "74px", border: "1px solid #8b93a6", fontSize: "14px", padding: "2px", backgroundColor: "#eef1f6" }}>장학사</th>
                      </tr>
                      <tr>
                        <td style={{ border: "1px solid #8b93a6", height: "60px" }}></td>
                        <td style={{ border: "1px solid #8b93a6" }}></td>
                      </tr>
                    </tbody>
                  </table>
                  <div style={{ fontSize: "16px", marginRight: "60px", paddingBottom: "4px" }}>
                    위원인 <span className="tp-val" style={{ display: "inline-block", width: "120px", textAlign: "center" }}>{state.applicant.name || ""}</span> (서명 또는 인)
                  </div>
                </div>

                {/* 학교장 직인 란 */}
                <div style={{ textAlign: "center", margin: "18px 0 10px", fontSize: "18px", fontWeight: "bold" }}>
                  <span className="tp-val">{formatSchoolTitle(state.applicant.schoolName, state.teacherType)}</span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;성명
                  <span className="tp-val" style={{ display: "inline-block", width: "120px", textAlign: "center" }}>{state.confirmation.principal || "○○○"}</span>직인<span style={{ marginLeft: "1.5cm" }}>(사인)</span>
                </div>

                {/* 교육감 귀하 */}
                <div style={{ textAlign: "left", marginTop: "20px" }}>
                  <div style={{ fontSize: "21px", fontWeight: "bold", letterSpacing: "1px" }}>
                    강원특별자치도교육감 귀하
                  </div>
                </div>

                <p className="tp-disclaimer">
                  ※ 본 시스템은 전보희망원 작성을 지원하기 위한 참고용 도구입니다. 작성된 내용은 제출 전 관련 실제 제출 전 반드시 「강원특별자치도 교육공무원 인사관리 지침(초등)」 부록 별표1·별표2 원문 및 기준에 따라 반드시 본인이 최종 검토·수정하시기 바랍니다.
                </p>
              </div>
            </div>
          </div>

          {/* ============================= 하단 툴바 ============================= */}
          <div className="tp-toolbar">
            <div className="tp-total-badge">
              <div className="tp-total-circle">{fmt(totalScore)}</div>
              <div className="tp-total-text">
                <b>총 평정점 {fmt(totalScore)}점</b>
                경력 {fmt(careerSubtotal)} + 가산점 {fmt(bonusSubtotal)}
              </div>
              {missingRequired && <span className="tp-warn">필수 항목을 확인해 주세요</span>}
            </div>
            <div className="tp-toolbar-btns">
              <button className="tp-btn" onClick={loadSampleData}>
                <Upload size={14} /> 샘플 불러오기
              </button>
              <button className="tp-btn" onClick={resetAll}>
                <RotateCcw size={14} /> 초기화
              </button>
              <button className="tp-btn" onClick={exportJSON}>
                <Download size={14} /> 내보내기
              </button>
              <label className="tp-btn tp-file-btn">
                <Upload size={14} /> 불러오기
                <input type="file" accept="application/json" onChange={importJSON} />
              </label>
              <button className="tp-btn primary" onClick={doPrint}>
                <Printer size={14} /> 인쇄 / PDF 저장
              </button>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<TransferApplicationPrototype />);
  </script>
</body>
</html>
